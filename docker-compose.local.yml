services:
  postgres:
    image: postgres:16-alpine
    container_name: uno-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: unojavagame
      POSTGRES_USER: uno_pg
      POSTGRES_PASSWORD: unoLocal2026
    ports:
      - "5432:5432"
    volumes:
      - uno-postgres-local:/var/lib/postgresql/data

  mongodb:
    image: mongo:7-jammy
    container_name: uno-mongodb-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: uno_root
      MONGO_INITDB_ROOT_PASSWORD: unoLocal2026
      MONGO_INITDB_DATABASE: unojavagame
      MONGO_APP_USER: uno_mongo
      MONGO_APP_PASS: unoLocal2026
    ports:
      - "27017:27017"
    volumes:
      - uno-mongo-local:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro

volumes:
  uno-postgres-local:
  uno-mongo-local:
